name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint with flake8 and Run unit tests with nose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 nose coverage

      - name: Lint with flake8
        run: |
          flake8 service tests --count --show-source --statistics

      - name: Run unit tests with nose
        run: |
          nosetests -v --with-coverage --cover-package=service tests
